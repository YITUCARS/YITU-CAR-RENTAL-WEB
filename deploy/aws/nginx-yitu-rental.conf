server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aws.yiturentalcars.co.nz;

    ssl_certificate /etc/letsencrypt/live/aws.yiturentalcars.co.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aws.yiturentalcars.co.nz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yiturentalcars.co.nz;

    ssl_certificate /etc/letsencrypt/live/yiturentalcars.co.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yiturentalcars.co.nz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://www.yiturentalcars.co.nz$request_uri;
}

