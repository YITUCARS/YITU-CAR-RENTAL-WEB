name: yitu-rental

services:
  web:
    image: yitu-rental-web:latest
    pull_policy: never
    container_name: yitu-rental-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3100:3000"
    networks:
      - yitu-edge
    mem_limit: 1152m
    cpus: 1.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  yitu-edge:
    external: true
